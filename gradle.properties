org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
# ForgeGradle aborts on a flaky TLS handshake with maven.minecraftforge.net.
systemProp.net.minecraftforge.gradle.check.certs=false

minecraft_version=1.20.1
forge_version=47.4.0
mod_version=1.2.8
maven_group=com.mtrpsdlcd
archives_base_name=mtr_psd_lcd

# MTR 3 for Forge 1.20.1 (the Forge build is Architectury-based; mtr.* classes
# are shared with the Fabric build, so the ported code compiles against either).
mtr_version=1.20.1-3.2.2-hotfix-2
mtr_modrinth_version=1.20.1-3.2.2-hotfix-2
architectury_version=9.2.14+forge
